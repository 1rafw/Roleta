<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta de Prêmios - CF Seguros</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;  
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .header-title {
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #f8fafc;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
            margin-bottom: 25px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.5));
        }
        canvas {
            border-radius: 50%;
            border: 6px solid #334155;
        }
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: #ffffff; 
            border-radius: 50%;
            background-image: url('Logo azul.png');
            background-size: 75%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(0,0,0,0.1);
            border: 4px solid #f8fafc;
        }
        .pointer {
            position: absolute;
            top: 50%;
            right: -12px; 
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            border-right: 32px solid #38bdf8; 
            z-index: 10;
            filter: drop-shadow(-3px 0px 4px rgba(0,0,0,0.4));
        }
        .spin-btn {
            padding: 16px 48px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .spin-btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            transform: translateY(-2px);
        }
        .spin-btn:active {
            transform: translateY(1px);
        }
        .spin-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #1e293b;
            padding: 35px 50px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.3s ease;
        }
        .modal-content h2 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .modal-content p {
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .modal-btn {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background-color: #0369a1;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="header-title">CF Seguros & Soluções</div>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="420" height="420"></canvas>
        <div class="center-logo"></div>
        <div class="center-logo" id="logo-trigger"></div>
        <div class="pointer"></div>
    </div>
    
    <button class="spin-btn" onclick="spinWheel()" id="spinBtn">Girar Roleta</button>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Parabéns! 🎉</h2>
            <p id="winnerText">Você ganhou: Opção 1</p>
            <button class="modal-btn" onclick="closeModal()">Resgatar Prêmio</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");

// 1. CONFIGURAÇÃO DOS ITENS E ODDS REAIS
// A soma inicial dos weights (pesos) é 100.
const items = [
    { id: 'sonho_valsa', text: "Sonho de Valsa", weight: 64.5, color1: "#0284c7", color2: "#0369a1" },      
    { id: 'kit', text: "Kit Caneta + Agenda", weight: 20.0, color1: "#1e293b", color2: "#0f172a" },    
    { id: 'garrafa', text: "Garrafa Squeeze", weight: 11.0, color1: "#0ea5e9", color2: "#0284c7" },      
    { id: 'caixa_som', text: "Caixa de Som", weight: 3.0, color1: "#334155", color2: "#1e293b" },
    { id: 'seguro', text: "Seguro Resid.", weight: 1.5, color1: "#475569", color2: "#334155" },
    { id: 'airfryer', text: "Airfryer", weight: 0.0, color1: "#f59e0b", color2: "#d97706" } // Começa com 0%
];

// VARIÁVEIS DE CONTROLE DE ESTOQUE
let contadorSeguro = 0;
const LIMITE_SEGURO = 10;

// VARIÁVEIS DE CONTROLE DO EASTER EGG (AIRFRYER)
let cliquesLogo = 0;
let timerCliques = null;
let airfryerAtiva = false;

// 2. LÓGICA DO GATILHO INVISÍVEL (EASTER EGG)
const logoTrigger = document.getElementById('logo-trigger');
logoTrigger.addEventListener('click', () => {
    if (airfryerAtiva) return; // Se já ativou, ignora

    cliquesLogo++;

    // Inicia a janela de tempo no primeiro clique
    if (cliquesLogo === 1) {
        timerCliques = setTimeout(() => {
            cliquesLogo = 0; // Reseta se não atingir 5 cliques em 2s
        }, 2000);
    }

    // Atingiu 5 cliques dentro do tempo
    if (cliquesLogo >= 5) {
        clearTimeout(timerCliques);
        airfryerAtiva = true;

        // Ajuste dinâmico das probabilidades
        let itemAirfryer = items.find(i => i.id === 'airfryer');
        let itemSonho = items.find(i => i.id === 'sonho_valsa');

        itemAirfryer.weight = 0.15;
        itemSonho.weight -= 0.15; // Mantém a soma total em 100%

        // Feedback visual sutil (borda da logo muda levemente de cor) e Log
        logoTrigger.style.borderColor = "#f59e0b";
        console.log("🔥 EASTER EGG ATIVADO! Airfryer entrou no jogo com odd de 0.15%!");
    }
});

let currentAngle = 0;
const totalSlices = items.length;
// Importante: No seu design, as fatias são desenhadas com tamanhos visuais IGUAIS, 
// o que é ótimo para a estética. A matemática dos pesos só age por trás dos panos.
const sliceAngle = (2 * Math.PI) / totalSlices;
let isSpinning = false;

function drawWheel(rotation = 0) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2;

    for (let i = 0; i < totalSlices; i++) {
        const startAngle = rotation + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        const sliceGradient = ctx.createRadialGradient(centerX, centerY, 40, centerX, centerY, radius);
        sliceGradient.addColorStop(0, items[i].color1);
        sliceGradient.addColorStop(1, items[i].color2);

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.fillStyle = sliceGradient;
        ctx.fill();
        
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        
        const midAngle = startAngle + sliceAngle / 2;
        ctx.rotate(midAngle);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px 'Segoe UI', Tahoma, sans-serif"; // Diminuí um pouco a fonte para caber "Seguro Resid."
        ctx.shadowColor = "rgba(0, 0, 0, 0.8)"; 
        ctx.shadowBlur = 4;

        const normalizedAngle = (midAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const isLeftHalf = normalizedAngle > Math.PI / 2 && normalizedAngle < (3 * Math.PI) / 2;

        if (isLeftHalf) {
            ctx.rotate(Math.PI);
            ctx.textAlign = "left";
            ctx.fillText(items[i].text, -(radius - 35), 6);
        } else {
            ctx.textAlign = "right";
            ctx.fillText(items[i].text, radius - 35, 6);
        }

        ctx.restore();
    }
}

function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById("spinBtn").disabled = true;

    // 3. MATEMÁTICA DO SORTEIO BASEADA NAS ODDS (PESOS)
    const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Math.random() * totalWeight;
    let winningIndex = 0;

    for (let i = 0; i < items.length; i++) {
        randomNum -= items[i].weight;
        if (randomNum <= 0) {
            winningIndex = i;
            break;
        }
    }

    // 4. LÓGICA DE TRAVA DE ESTOQUE (Verificação pós-sorteio)
    if (items[winningIndex].id === 'seguro') {
        contadorSeguro++;
        console.log(`Seguro Residencial sorteado! Restam: ${LIMITE_SEGURO - contadorSeguro}`);
        
        if (contadorSeguro >= LIMITE_SEGURO) {
            let itemSeguro = items.find(i => i.id === 'seguro');
            let itemSonho = items.find(i => i.id === 'sonho_valsa');

            // Transfere o peso restante para o Sonho de Valsa
            itemSonho.weight += itemSeguro.weight;
            itemSeguro.weight = 0;
            
            console.log("🔒 ESTOQUE ESGOTADO: A chance do Seguro Residencial agora é 0%.");
        }
    }

    const sliceCenterAngle = winningIndex * sliceAngle + sliceAngle / 2;
    const extraSpins = 7 * 2 * Math.PI; 
    
    const normalizedCurrentAngle = currentAngle % (2 * Math.PI);
    const targetBaseRotation = (2 * Math.PI) - sliceCenterAngle;
    
    let rotationNeeded = targetBaseRotation - normalizedCurrentAngle;
    if (rotationNeeded < 0) {
        rotationNeeded += (2 * Math.PI);
    }
    
    const totalDistance = extraSpins + rotationNeeded;
    const startAngle = currentAngle; 

    const duration = 4500; 
    let start = null;

    function animate(timestamp) {
        if (!start) start = timestamp;
        const elapsed = timestamp - start;
        
        let progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 4);
        
        currentAngle = startAngle + totalDistance * easeOut;
        drawWheel(currentAngle);

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            isSpinning = false;
            document.getElementById("spinBtn").disabled = false;
            showModal(items[winningIndex].text);
        }
    }
    requestAnimationFrame(animate);
}

function showModal(prize) {
    document.getElementById("winnerText").innerText = `Você ganhou: ${prize}`;
    document.getElementById("resultModal").classList.add("active");
}

function closeModal() {
    document.getElementById("resultModal").classList.remove("active");
}

// Inicializa a roleta
drawWheel();
    </script>
</body>
</html>
