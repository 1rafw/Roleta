<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- PWA: permite "Adicionar à tela inicial" no tablet do evento -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#075485">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Roleta CF">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">

    <title>Roleta de Prêmios - CF Seguros</title>
    <!-- O ?v= no final força o navegador a baixar o arquivo novo em vez de
         usar a versão em cache. SEMPRE que editar style.css ou script.js,
         aumente esse número (v=2, v=3...) antes de subir pro GitHub. -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div class="status-bar" id="statusBar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText" aria-live="polite">Sincronizado</span>
    </div>

    <header class="topo">
        <img src="logo-branca.png" alt="CF Seguros &amp; Soluções" class="logo-marca">
        <h1 class="header-title">Roleta CF</h1>
    </header>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="640" height="640" role="img" aria-label="Roleta de prêmios CF Seguros"></canvas>
        <div class="center-logo" id="logo-trigger" role="button" tabindex="0" aria-label="Logo CF Seguros"></div>
        <div class="pointer" aria-hidden="true"></div>
    </div>
    
    <button class="spin-btn" onclick="spinWheel()" id="spinBtn" aria-label="Girar a roleta de prêmios">Girar Roleta</button>

    <!-- A região de anúncio pra leitor de tela agora é criada dinamicamente
         em JS (função anunciarParaLeitorDeTela) e removida do DOM logo em
         seguida — ver comentário na função pra entender o motivo. -->

    <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" aria-hidden="true">
        <div class="modal-content" id="modalContent">
            <h2 id="modalTitulo">Parabéns! 🎉</h2>
            <p id="winnerText"></p>

            <div class="voucher-block" id="voucherBlock">
                <p class="voucher-info">Tire uma foto deste código e apresente no contato para resgatar seu Seguro Residencial:</p>
                <div class="voucher-codigo" id="voucherCodigo"></div>
                <div class="voucher-data" id="voucherData"></div>
            </div>

            <button class="modal-btn modal-btn-fechar" onclick="closeModal()" id="btnFecharModal" aria-label="Fechar">Resgatar Prêmio</button>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
