<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta de Prêmios - CF Seguros</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .header-title {
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #f8fafc;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .status-bar {
            position: fixed;
            top: 10px;
            right: 14px;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            transition: background 0.3s;
        }
        .status-dot.offline {
            background: #ef4444;
        }
        .status-dot.pending {
            background: #f59e0b;
        }
        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
            margin-bottom: 25px;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.5));
        }
        canvas {
            border-radius: 50%;
            border: 6px solid #334155;
        }
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background-color: #ffffff; 
            border-radius: 50%;
            background-image: url('Logo azul.png');
            background-size: 75%;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 5;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(0,0,0,0.1);
            border: 4px solid #f8fafc;
            cursor: pointer;
        }
        .pointer {
            position: absolute;
            top: 50%;
            right: -12px; 
            transform: translateY(-50%);
            width: 0; 
            height: 0; 
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            border-right: 32px solid #38bdf8; 
            z-index: 10;
            filter: drop-shadow(-3px 0px 4px rgba(0,0,0,0.4));
        }
        .spin-btn {
            padding: 16px 48px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            touch-action: manipulation;
        }
        .spin-btn:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            transform: translateY(-2px);
        }
        .spin-btn:active {
            transform: translateY(1px);
        }
        .spin-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px 50px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.3s ease;
        }
        .modal-content h2 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .modal-content p {
            font-size: 22px;
            margin-bottom: 25px;
            font-weight: 500;
        }
        .modal-btn {
            padding: 12px 30px;
            font-size: 16px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .modal-btn:hover {
            background-color: #0369a1;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); }
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Sincronizado</span>
    </div>

    <div class="header-title">CF Seguros & Soluções</div>

    <div class="wheel-container">
        <canvas id="wheelCanvas" width="420" height="420"></canvas>
        <div class="center-logo" id="logo-trigger"></div>
        <div class="pointer"></div>
    </div>
    
    <button class="spin-btn" onclick="spinWheel()" id="spinBtn">Girar Roleta</button>

    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>Parabéns! 🎉</h2>
            <p id="winnerText"></p>
            <button class="modal-btn" onclick="closeModal()">Resgatar Prêmio</button>
        </div>
    </div>

    <script>
   
        const SHEETS_ENDPOINT = "https://script.google.com/macros/s/SEU_ID_AQUI/exec";

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");

        const items = [
            { id: 'sonho_valsa', text: "Sonho de Valsa", weight: 64.5, color1: "#be185d", color2: "#9d174d" },
            { id: 'caneta', text: "Caneta", weight: 20.0, color1: "#0ea5e9", color2: "#0284c7" },
            { id: 'seguro', text: "Seguro Resid.", weight: 1.5, color1: "#f59e0b", color2: "#d97706" },
            { id: 'caixa_som', text: "Caixa de Som", weight: 3.0, color1: "#8b5cf6", color2: "#6d28d9" },
            { id: 'garrafa', text: "Mochila", weight: 11.0, color1: "#10b981", color2: "#059669" },
            { id: 'airfryer', text: "Airfryer", weight: 0.0, color1: "#ef4444", color2: "#b91c1c", esgotado: false },
            
        ];

        let contadorSeguro = 0;
        const LIMITE_SEGURO = 10;

        let cliquesLogo = 0;
        let timerCliques = null;
        let airfryerAtiva = false;

        const logoTrigger = document.getElementById('logo-trigger');
        logoTrigger.addEventListener('click', () => {
            if (airfryerAtiva) return;

            cliquesLogo++;

            if (cliquesLogo === 1) {
                timerCliques = setTimeout(() => {
                    cliquesLogo = 0;
                }, 2000);
            }

            if (cliquesLogo >= 5) {
                clearTimeout(timerCliques);
                airfryerAtiva = true;

                let itemAirfryer = items.find(i => i.id === 'airfryer');
                let itemSonho = items.find(i => i.id === 'sonho_valsa');

                
                itemAirfryer.weight = 5.0;
                itemSonho.weight -= 5.0;

                logoTrigger.style.borderColor = "#f59e0b";
                console.log("Odd da airfryer ajustada.");
            }
        });

        let currentAngle = 0;
        const totalSlices = items.length;
        const sliceAngle = (2 * Math.PI) / totalSlices;
        let isSpinning = false;

        function drawWheel(rotation = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            for (let i = 0; i < totalSlices; i++) {
                const startAngle = rotation + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                const estaEsgotado = !!items[i].esgotado;

                const sliceGradient = ctx.createRadialGradient(centerX, centerY, 40, centerX, centerY, radius);
                if (estaEsgotado) {
                    sliceGradient.addColorStop(0, "#4b5563");
                    sliceGradient.addColorStop(1, "#1f2937");
                } else {
                    sliceGradient.addColorStop(0, items[i].color1);
                    sliceGradient.addColorStop(1, items[i].color2);
                }

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.fillStyle = sliceGradient;
                ctx.fill();

                if (estaEsgotado) {
                 
                    ctx.save();
                    ctx.clip();
                    ctx.strokeStyle = "rgba(0,0,0,0.35)";
                    ctx.lineWidth = 3;
                    for (let d = -radius; d < radius * 2; d += 14) {
                        ctx.beginPath();
                        ctx.moveTo(centerX + d, centerY - radius);
                        ctx.lineTo(centerX + d - radius, centerY + radius);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                
                ctx.lineWidth = 6;
                ctx.strokeStyle = "#0f172a";
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                
                const midAngle = startAngle + sliceAngle / 2;
                ctx.rotate(midAngle);

                ctx.fillStyle = estaEsgotado ? "#d1d5db" : "#ffffff";
                ctx.font = "bold 16px 'Segoe UI', Tahoma, sans-serif";
                ctx.shadowColor = "rgba(0, 0, 0, 0.95)"; 
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;

                const maxTextWidth = 125; 
                const normalizedAngle = (midAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
                const isLeftHalf = normalizedAngle > Math.PI / 2 && normalizedAngle < (3 * Math.PI) / 2;

                const textoExibido = estaEsgotado ? "ESGOTADO" : items[i].text;

                if (isLeftHalf) {
                    ctx.rotate(Math.PI);
                    ctx.textAlign = "left";
                    ctx.fillText(textoExibido, -(radius - 15), 5, maxTextWidth);
                } else {
                    ctx.textAlign = "right";
                    ctx.fillText(textoExibido, radius - 15, 5, maxTextWidth);
                }

                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;

            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let winningIndex = 0;

            for (let i = 0; i < items.length; i++) {
                randomNum -= items[i].weight;
                if (randomNum <= 0) {
                    winningIndex = i;
                    break;
                }
            }

            if (items[winningIndex].id === 'seguro') {
                contadorSeguro++;
                
                if (contadorSeguro >= LIMITE_SEGURO) {
                    let itemSeguro = items.find(i => i.id === 'seguro');
                    let itemSonho = items.find(i => i.id === 'sonho_valsa');

                    itemSonho.weight += itemSeguro.weight;
                    itemSeguro.weight = 0;
                }
            }

            if (items[winningIndex].id === 'airfryer') {
                let itemAirfryer = items.find(i => i.id === 'airfryer');
                let itemSonho = items.find(i => i.id === 'sonho_valsa');

            
                itemSonho.weight += itemAirfryer.weight;
                itemAirfryer.weight = 0;
                itemAirfryer.esgotado = true;
            }

            const sliceCenterAngle = winningIndex * sliceAngle + sliceAngle / 2;
            const extraSpins = 7 * 2 * Math.PI; 
            
            const normalizedCurrentAngle = currentAngle % (2 * Math.PI);
            const targetBaseRotation = (2 * Math.PI) - sliceCenterAngle;
            
            let rotationNeeded = targetBaseRotation - normalizedCurrentAngle;
            if (rotationNeeded < 0) {
                rotationNeeded += (2 * Math.PI);
            }
            
            const totalDistance = extraSpins + rotationNeeded;
            const startAngle = currentAngle; 

            const duration = 4500; 
            let start = null;

            function animate(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                
                let progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 4);
                
                currentAngle = startAngle + totalDistance * easeOut;
                drawWheel(currentAngle);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById("spinBtn").disabled = false;

                    const premioGanho = items[winningIndex];
                    showModal(premioGanho.text);
                    registrarPremio({ id: premioGanho.id, nome: premioGanho.text });
                }
            }
            requestAnimationFrame(animate);
        }

        function showModal(prize) {
            document.getElementById("winnerText").innerText = `Você ganhou: ${prize}`;
            document.getElementById("resultModal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("resultModal").classList.remove("active");
        }

    
        const STORAGE_KEY = 'historico_premios_cf';

        function getHistorico() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (e) {
                return [];
            }
        }

        function salvarHistorico(historico) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(historico));
        }

        function atualizarStatusBar() {
            const historico = getHistorico();
            const pendentes = historico.filter(h => !h.sincronizado).length;
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (pendentes === 0) {
                dot.className = 'status-dot';
                text.textContent = 'Sincronizado';
            } else {
                dot.className = 'status-dot pending';
                text.textContent = `${pendentes} pendente(s)`;
            }
        }

        // Registra um prêmio: salva local sempre, depois tenta enviar pro Sheets
        function registrarPremio(premio) {
            const historico = getHistorico();
            const registro = {
                ...premio,
                timestamp: new Date().toISOString(),
                sincronizado: false
            };
            historico.push(registro);
            salvarHistorico(historico);
            atualizarStatusBar();

            enviarParaSheets(registro, historico.length - 1);
        }

        function enviarParaSheets(registro, indice) {
            fetch("https://script.google.com/macros/s/AKfycbyBiVbJiHmNEkMOKR46Jz3-NP4V_tohdzSl0CxJQEbs1gI6TbNj3BUsInMoTodj6yFGiQ/exec", {
                method: 'POST',
              
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ id: registro.id, nome: registro.nome })
            })
            .then(response => response.json())
            .then(() => {
                const historico = getHistorico();
                if (historico[indice]) {
                    historico[indice].sincronizado = true;
                    salvarHistorico(historico);
                }
                atualizarStatusBar();
                console.log('Registrado na planilha:', registro.nome);
            })
            .catch(error => {
                console.warn('Sem conexão — item salvo localmente, será reenviado:', error);
                atualizarStatusBar();
            });
        }

        // Tenta reenviar tudo que ainda não foi sincronizado
        // (roda ao carregar a página e sempre que a conexão voltar)
        function tentarResincronizar() {
            const historico = getHistorico();
            historico.forEach((registro, indice) => {
                if (!registro.sincronizado) {
                    enviarParaSheets(registro, indice);
                }
            });
        }

        window.addEventListener('online', () => {
            document.getElementById('statusDot').classList.remove('offline');
            tentarResincronizar();
        });

        window.addEventListener('offline', () => {
            document.getElementById('statusDot').classList.add('offline');
            document.getElementById('statusText').textContent = 'Sem internet';
        });

        // Inicialização
        drawWheel();
        atualizarStatusBar();
        tentarResincronizar();
    </script>
</body>
</html>
